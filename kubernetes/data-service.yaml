# Requiere Secret 'data-service-db' (GCP_DATABASE_URL, AWS_DATABASE_URL) en otel-lab.
# Crear secretos de manera segura fuera de Git y nunca versionarlos.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-service
  namespace: otel-lab
  labels: {app: data-service}
spec:
  replicas: 1
  selector:
    matchLabels: {app: data-service}
  template:
    metadata:
      labels: {app: data-service}
    spec:
      enableServiceLinks: false
      containers:
        - name: data-service
          image: REPLACE_WITH_IMAGE_FROM_REGISTRY
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8002}]
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.otel-lab.svc.cluster.local:4317
            - name: DEPLOYMENT_ENVIRONMENT
              value: sandbox
            - name: FAULT_ENABLED
              value: "false"
            - name: FAULT_RATE
              value: "0.10"
            - name: GCP_DATABASE_URL
              valueFrom:
                secretKeyRef: {name: data-service-db, key: GCP_DATABASE_URL}
            - name: AWS_DATABASE_URL
              valueFrom:
                secretKeyRef: {name: data-service-db, key: AWS_DATABASE_URL}
          readinessProbe:
            httpGet: {path: /ready, port: 8002}
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 8002}
            initialDelaySeconds: 10
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: data-service
  namespace: otel-lab
spec:
  selector: {app: data-service}
  ports: [{name: http, port: 8002, targetPort: 8002}]
  type: ClusterIP
